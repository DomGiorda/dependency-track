server {

	listen 8080;
	server_name dtrack.etam.co;
	return 301 https://dtrack.etam.co$request_uri;


}

server {

	listen 443 ssl;

	client_max_body_size 60M;
	server_name example.com;

    ssl_certificate /etc/nginx/certs/${PEM_FILE};
    ssl_certificate_key /etc/ssl/private/${KEY_FILE};
	ssl_protocols TLSv1.1 TLSv1.2;
	ssl_ciphers 'ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-DSS-AES128-GCM-SHA256:kEDH+AESGCM:ECDHE-RSA-AES128-SHA256:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA:ECDHE-ECDSA-AES128-SHA:ECDHE-RSA-AES256-SHA384:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA:ECDHE-ECDSA-AES256-SHA:DHE-RSA-AES128-SHA256:DHE-RSA-AES128-SHA:DHE-DSS-AES128-SHA256:DHE-RSA-AES256-SHA256:DHE-DSS-AES256-SHA:DHE-RSA-AES256-SHA:!aNULL:!eNULL:!EXPORT:!DES:!RC4:!3DES:!MD5:!PSK';
	ssl_prefer_server_ciphers on;

  # Location for static files (e.g., index.html)
    location / {
        root      /opt/owasp/dependency-track-frontend;
        index     index.html;
        try_files $uri $uri/ /index.html;

        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Ssl on;
        # proxy_set_header X-SSL-CERT $ssl_client_cert;
        proxy_set_header X-SSL-CERT $ssl_client_escaped_cert;
    }

  # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://${BASE_URL}:8081;
        proxy_read_timeout 90;
        proxy_redirect http://${BASE_URL}:8081 https://${BASE_URL};
    }
}